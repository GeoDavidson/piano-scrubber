<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Piano Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/stitcher.css">
</head>
<body>

  <div id="toolbar">
    <div class="toolbar-group">
      <label class="toolbar-label" for="sensitivity">Sens</label>
      <input type="range" id="sensitivity" min="1" max="20" value="3">
      <span class="toolbar-value" id="sensitivity-value">3</span>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <label class="toolbar-label" for="fps">FPS</label>
      <input type="number" id="fps" min="1" max="120" step="1" value="30">
    </div>

    <div class="toolbar-group">
      <label class="toolbar-label" for="scrub-audio">Audio</label>
      <input type="checkbox" id="scrub-audio" checked>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <button id="sel-in-btn" class="t-btn">In <kbd>i</kbd></button>
      <button id="sel-out-btn" class="t-btn">Out <kbd>o</kbd></button>
      <button id="sel-clear-btn" class="t-btn t-btn-danger">&#x2715;</button>
      <button id="sel-play-btn" class="t-btn t-btn-play" disabled>Play <kbd>space</kbd></button>
      <label class="toolbar-label toolbar-loop">
        <input type="checkbox" id="sel-loop" checked> Loop
      </label>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <label class="toolbar-label" for="sel-speed">Speed</label>
      <input type="range" id="sel-speed" min="0.1" max="2" step="0.1" value="1">
      <span class="toolbar-value" id="sel-speed-value">1.0x</span>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <label class="toolbar-label" for="accent-color">Color</label>
      <input type="color" id="accent-color" value="#FF6B00">
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <button id="mode-scrub-btn" class="t-btn t-btn-mode active">Scrub</button>
      <button id="mode-stitch-btn" class="t-btn t-btn-mode">Stitch</button>
    </div>
  </div>

  <div id="stage">
    <div id="stage-scrubber" class="stage-mode">
      <div id="picker">
        <label class="open-btn" for="video-file">Open Video</label>
        <input type="file" id="video-file" accept="video/*" hidden>
        <p id="picker-hint">Drop a video file or click to browse &middot; scrub with scroll wheel</p>
      </div>
      <canvas id="frame-canvas"></canvas>
    </div>
    <div id="stage-stitcher" class="stage-mode" hidden>
      <div id="stitch-stage">
        <div id="stitch-picker">
          <label class="open-btn" for="stitch-file">Open Video for Stitching</label>
          <input type="file" id="stitch-file" accept="video/*" hidden>
          <label class="open-btn stitch-load-btn" for="stitch-image-file">Load Saved Image</label>
          <input type="file" id="stitch-image-file" accept="image/*" hidden>
          <p id="stitch-hint">Drop a Synthesia-style tutorial video, or load a previously stitched PNG</p>
          <button id="stitch-start-btn" class="t-btn t-btn-play" hidden>Stitch</button>
        </div>
        <div id="stitch-progress" hidden>
          <div id="stitch-progress-label">Analyzing scroll rate&#x2026;</div>
          <div id="stitch-progress-bar"><div id="stitch-progress-fill"></div></div>
          <div id="stitch-progress-detail">Frame 0 / 0</div>
          <button id="stitch-cancel-btn" class="t-btn t-btn-danger">Cancel</button>
        </div>
        <div id="stitch-viewer" hidden>
          <div id="stitch-viewer-toolbar">
            <button id="stitch-download-btn" class="t-btn">Download PNG</button>
            <button id="stitch-restart-btn" class="t-btn">Stitch Another</button>
          </div>
          <div id="stitch-scroll">
            <canvas id="stitch-canvas"></canvas>
          </div>
          <div id="keyboard-overlay"><!-- user fills in later --></div>
        </div>
      </div>
    </div>
  </div>

  <div id="hud">
    <div id="hud-info">
      <span id="hud-frame">Frame 0</span>
      <span id="hud-time">0:00.000</span>
      <span id="hud-duration">0:00.000</span>
    </div>
    <div id="progress-bar">
      <div id="selection-fill"></div>
      <div id="progress-fill"></div>
    </div>
    <div id="sel-info"></div>
  </div>

  <video id="video-source" style="display:none" preload="auto"></video>
  <video id="stitch-video" style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none" preload="auto"></video>

<script src="/static/app.js"></script>
<script src="/static/stitcher.js"></script>

</body>
</html>
