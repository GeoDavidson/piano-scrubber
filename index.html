<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano Roll Library</title>
<style>
  :root {
    --bg: #111;
    --card-bg: #1e1e1e;
    --card-hover: #272727;
    --text: #eee;
    --muted: #777;
    --accent: #6fa3e0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 2rem 2rem 1.5rem;
    border-bottom: 1px solid #222;
  }
  header h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -.01em; }
  header p { margin-top: .4rem; color: var(--muted); font-size: .9rem; }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.25rem;
    padding: 2rem;
  }

  .card {
    background: var(--card-bg);
    border-radius: 10px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: background .15s, transform .15s, box-shadow .15s;
  }
  .card:hover {
    background: var(--card-hover);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .card .thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    background: #000;
  }
  .card .info {
    padding: .75rem 1rem .9rem;
  }
  .card .info h2 {
    font-size: .95rem;
    font-weight: 500;
    line-height: 1.4;
  }

  #empty {
    display: none;
    text-align: center;
    padding: 7rem 2rem;
    color: var(--muted);
    line-height: 1.8;
  }
  #empty code {
    background: #222;
    padding: .2em .55em;
    border-radius: 4px;
    font-size: .9em;
    color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <h1>Piano Roll Library</h1>
  <p>Click a video to open the scrollable roll.</p>
</header>

<div id="grid"></div>

<div id="empty">
  <p>No videos yet.</p>
  <p>Run <code>python add.py &lt;youtube-url&gt;</code> to add your first video.</p>
</div>

<!-- auto-generated by add.py -->
<script src="videos/library.js"></script>

<script>
  const grid  = document.getElementById("grid");
  const empty = document.getElementById("empty");

  const library = (typeof LIBRARY !== "undefined") ? LIBRARY : [];

  if (library.length === 0) {
    empty.style.display = "block";
  } else {
    library.forEach(v => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = `viewer.html?id=${encodeURIComponent(v.id)}`;

      const img = document.createElement("img");
      img.className = "thumb";
      img.src = `videos/${v.id}/thumb.jpg`;
      img.alt = v.title;
      img.onerror = () => { img.style.background = "#000"; img.removeAttribute("src"); };

      const info = document.createElement("div");
      info.className = "info";
      info.innerHTML = `<h2>${v.title.replace(/</g, "&lt;")}</h2>`;

      a.appendChild(img);
      a.appendChild(info);
      grid.appendChild(a);
    });
  }
</script>
</body>
</html>
